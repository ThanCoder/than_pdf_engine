# Run with `dart run ffigen --config ffigen.yaml`.
name: ThanPdfEngineBindings
description: |
  Bindings for `src/than_pdf_engine.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: "lib/than_pdf_engine_bindings_generated.dart"
headers:
  entry-points:
    - "src/include/*.h"
  include-directives:
    - "src/include/*.h"
ffi-native:
comments:
  style: any
  length: full
